<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Stinger Guard</title>
  <style>
    body {
      width: 300px;
      min-height: 100px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 8px 0;
    }
    .status {

  <h1>Stinger Guard</h1>
