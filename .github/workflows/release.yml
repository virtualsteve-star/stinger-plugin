name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 20.x
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run CI checks
      run: npm run ci
    
    - name: Build extension
      run: npm run build
    
    - name: Create release zip
      run: |
        cd dist
        zip -r ../stinger-guard-${{ github.ref_name }}.zip *
        cd ..
    
    - name: Generate changelog
      id: changelog
      run: |
        echo "## What's Changed" > CHANGELOG.md
        git log $(git describe --tags --abbrev=0 HEAD^)..HEAD --pretty=format:"- %s" >> CHANGELOG.md
        echo "" >> CHANGELOG.md
        echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$(git describe --tags --abbrev=0 HEAD^)...${{ github.ref_name }}" >> CHANGELOG.md
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: stinger-guard-${{ github.ref_name }}.zip
        body_path: CHANGELOG.md
        draft: false
        prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
        
    - name: Upload to Chrome Web Store
      if: ${{ !contains(github.ref_name, '-beta') && !contains(github.ref_name, '-rc') }}
      env:
        CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
        CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
        CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        CHROME_APP_ID: ${{ secrets.CHROME_APP_ID }}
      run: |
        echo "Chrome Web Store upload would happen here"
        # npx chrome-webstore-upload-cli upload --source stinger-guard-${{ github.ref_name }}.zip --auto-publish